name: Build FitTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FitTrackAndroid-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip FitTrackAndroid-Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: FitTrackAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-debug-APK
          path: FitTrackAndroid/app/build/outputs/apk/debug/app-debug.apk
          
